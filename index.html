<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="author" content="Dhruv Dinasi" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Theme before paint (dark is the default) + flag JS for progressive reveal animations.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
    <title>Dhruv Dinasi — AI & software engineering portfolio</title>
    <meta name="description" content="Dhruv Dinasi is an Information Science student in Bangalore building AI-powered software." />
    <link rel="canonical" href="https://dhruvdinasi.com/" />
    <meta property="og:title" content="Dhruv Dinasi" />
    <meta property="og:description" content="Dhruv Dinasi is an Information Science student in Bangalore building AI-powered software." />
    <meta property="og:url" content="https://dhruvdinasi.com/" />
    <!--/app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
