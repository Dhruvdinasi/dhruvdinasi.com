<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: IT; src: url(../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2); font-weight: 100 900; }
  @font-face { font-family: IS; font-style: italic; src: url(../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2); }
  @font-face { font-family: JB; src: url(../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2); font-weight: 100 900; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #090a0d; color: #edece7; font-family: IT; position: relative; overflow: hidden; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(237,236,231,.10) 1px, transparent 1px); background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 30% 40%, #000 30%, transparent 80%); }
  .glow { position: absolute; right: -160px; top: -200px; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(80,120,255,.32), transparent); }
  .wrap { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .label { font-family: JB; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: #9ca1ae; display: flex; align-items: center; gap: 14px; }
  .label i { width: 10px; height: 10px; border-radius: 50%; background: #6e96ff; display: inline-block; }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 600; margin: 0; }
  h1 em { font-family: IS; font-weight: 400; letter-spacing: 0; color: #6e96ff; }
  .foot { display: flex; justify-content: space-between; align-items: end; }
  .name { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; }
  .url { font-family: JB; font-size: 22px; color: #9ca1ae; }
  .grid { position: absolute; right: 80px; top: 120px; display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; opacity: .9; }
  .grid div { height: 60px; border-radius: 8px; border: 1px solid #282c36; background: rgba(237,236,231,.04); }
  .grid .h { border-color: rgba(255,168,92,.7); background: rgba(255,168,92,.3); }
  .grid .m { border-color: rgba(255,168,92,.5); background: rgba(255,168,92,.12); }
</style>
</head>
<body>
  <div class="dots"></div><div class="glow"></div>
  <div class="grid"><div></div><div></div><div class="m"></div><div></div><div></div><div class="h"></div><div></div><div></div><div></div></div>
  <div class="wrap">
    <div class="label"><i></i>Information Science · RVITM Bangalore</div>
    <h1>I build software<br/>that pays attention<br/>to <em>crowds, kilowatts, taste.</em></h1>
    <div class="foot"><div class="name">Dhruv Dinasi</div><div class="url">dhruvdinasi.com</div></div>
  </div>
</body>
</html>
